[project]
name = "miniflow-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30",
    "websockets>=17.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
